<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: box-border;
      }
      div {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(48, 43, 43);
        filter: drop-shadow(12px, 12px red);
        filter: blur(60%);
        text-decoration: 2s;
      }
      img {
        height: 600px;
        width: auto;
      }

      div:hover {
        filter: 0px;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="holloween.png" alt="photo" />
      <h1>photo</h1>
    </div>
  </body>
</html>
