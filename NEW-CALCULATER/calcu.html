</head>
<body>
    <section id = "men-sec">
        <div id = "sec-1">
            <p id = "display">0</p>
        </div>
        <div id = "sec-2">
            <button id = "btn-1" onclick="clearDisplay()">C</button>
            <button id = "btn-2" style="font-size: 16px;" onclick="append('%')">%</button>
            <button id = "btn-3" onclick="append('/')">/</button>
        </div>
        <div id = "sec-3">
            <button id ="btn-4" onclick="append('*')">x</button>
            <button  id ="btn-5" onclick="append('7')">7</button>
            <button  id ="btn-6" onclick="append('8')">8</button>
            <button  id ="btn-7">9</button>

        </div>
        <div id = "sec-4">
            <button id = "btn-8" onclick="append('-')">-</button>
            <button id = "btn-9" onclick="append('4')">4</button>
            <button id = "btn-10" onclick="append('5')">5</button>
            <button id = "btn-11" onclick="append('6')">6</button>

        </div>

        <div id = "sec-6">
            <button id = "btn-16" onclick="append('+')">+</button>
            <button id = "btn-17" onclick="append('1')">1</button>
            <button id = "btn-18" onclick="append('2')">2</button>
            <button id = "btn-19" onclick="append('3')">3</button>

        </div>

        <div id = "sec-7">
            <button id = "btn-20" onclick="calculate()">=</button>
            <button id = "btn-21" style="font-size: 16px;" onclick="append('00')">00</button>
            <button id = "btn-22" onclick="append('0')">0</button>
            <button id = "btn-23" onclick="append('.')">.</button>

        </div>



    </section>
    
        <script>
            let display = document.getElementById("display");

            function append(value){
                if(display.innerText === '0'){
                    display.innerText = value;
                }else{
                    display.innerText = display.innerText + value;
                }
            }

            function clearDisplay(){
                display.innerText = '0';
            }

            function calculate(){
                try{
                    display.innerText = eval(display.innerText);
                }catch{
                    display.innerText = 'Error';

                }
            }
        
    </script>
    
</body>
