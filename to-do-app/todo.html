<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificate Generator</title>
  <style>
    body {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      font-family: Arial, sans-serif;
      background-color: #f8e7c7;
      margin: 0;
      padding: 40px;
    }

    .form-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    h2 {
      text-align: center;
      color: #5a5aff;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #generateBtn {
      width: 100%;
      background-color: blue;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .certificate {
      background-color: #f8e7c7;
      padding: 20px;
      font-size: 18px;
      width: 50%;
    }

    .certificate b {
      border-bottom: 1px solid black;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>Certificate Details</h2>
    <p style="text-align:center;">Fill these details to generate certificate</p>

    <label>Enter your name</label>
    <input type="text" id="name">

    <label>Enter your father name</label>
    <input type="text" id="fatherName">

    <label>Choose your gender</label>
    <select id="gender">
      <option value="" disabled selected>Choose your gender</option>
      <option value="S/O">Male</option>
      <option value="D/O">Female</option>
      <option value="Child of">Other</option>
    </select>

    <label>Obtained Marks</label>
    <input type="number" id="obtained">

    <label>Total Marks</label>
    <input type="number" id="total">

    <button id="generateBtn">Generate</button>
  </div>

  <div class="certificate" id="certificate">
    <p>This is certify that <b></b> <span id="so">S/O</span> <b></b></p>
    <p>has scored <b></b> in Quiz Examination organized by Inflection ORG.</p>
  </div>

  <script>
    document.getElementById("generateBtn").onclick = function () {
      const name = document.getElementById("name").value;
      const father = document.getElementById("fatherName").value;
      const gender = document.getElementById("gender").value;
      const obtained = document.getElementById("obtained").value;
      const total = document.getElementById("total").value;

      if (name && father && gender && obtained && total) {
        document.getElementById("certificate").innerHTML = `
          <p>This is certify that <b>${name}</b> ${gender} <b>${father}</b></p>
          <p>has scored <b>${obtained}/${total}</b> in Quiz Examination organized by Inflection ORG.</p>
        `;
      } else {
        alert("Please fill all fields.");
      }
    };
  </script>

</body>
</html>
